# Frontend CI: install the lockfile dependencies, then check lint and the production build.
name: CI

# Trigger checks for pushes and pull requests targeting main.
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Keep GitHub workflow permissions limited to reading repository contents.
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    # Run frontend commands from the frontend directory.
    defaults:
      run:
        working-directory: frontend

    # Run the reproducible validation steps in order.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # Validate the standalone scoring service with the existing synthetic ranking test.
  screening:
    name: Screening tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cv-screening
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cv-screening/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test ranking
        run: python -m unittest discover -s tests -v
